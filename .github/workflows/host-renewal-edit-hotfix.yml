name: Host renewal edit hotfix

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/host-renewal-edit-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Add renewal date edit popup
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')

          marker = "function deleteHostSubscription(id) {"
          fn = """function editHostRenewalDate(id) {
            const hosts = loadHostSubscriptions();
            const host = hosts.find(h => h.id === id);
            if (!host) return;
            const current = normalizeStartDate(host.renewalDate) || '';
            const value = prompt('Renewal date (dd.mm.yyyy):', current);
            if (value === null) return;
            const normalized = normalizeStartDate(value);
            if (!normalized) return showToast('Use date format dd.mm.yyyy', 'error');
            host.renewalDate = normalized;
            saveHostSubscriptions(hosts);
            renderAccounts();
            showToast('Renewal date updated');
          }

          """
          if fn.strip() not in text:
            if marker not in text:
              raise SystemExit('deleteHostSubscription marker not found')
            text = text.replace(marker, fn + marker, 1)

          old = "        <td>${formatAccountDate(host.renewalDate)}</td>"
          new = "        <td>${formatAccountDate(host.renewalDate)} <button class=\"date-edit-btn\" onclick=\"editHostRenewalDate('${hostId}')\" title=\"Edit renewal date\" aria-label=\"Edit renewal date\">✏️</button></td>"
          if old not in text:
            raise SystemExit('renewal date cell not found')
          text = text.replace(old, new, 1)

          app.write_text(text, encoding='utf-8')
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit changes and remove temporary workflow
        run: |
          rm .github/workflows/host-renewal-edit-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/host-renewal-edit-hotfix.yml
          git commit -m "feat: add renewal date quick edit popup"
          git push origin master
