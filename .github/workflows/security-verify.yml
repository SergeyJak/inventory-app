name: Security verify

on:
  push:
    branches:
      - security/npm-audit-2026-10-07

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/npm-audit-2026-10-07
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install
        run: npm ci --ignore-scripts
      - name: Audit
        run: npm audit
      - name: Full tests
        run: npm test
      - name: Mail tests
        run: npm run test:mail
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/security-verify.yml
          git commit -m "security: verify Node 22 dependency set"
          git push
