name: Renewal sort hotfix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/renewal-sort-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Patch host renewal sorting
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          old = ".sort((a, b) => String(a.renewalDate || '').localeCompare(String(b.renewalDate || '')) || String(a.hostMail || '').localeCompare(String(b.hostMail || '')))"
          new = (".sort((a, b) => {\n"
                 "      const aTime = startDateTime(a.renewalDate);\n"
                 "      const bTime = startDateTime(b.renewalDate);\n"
                 "      if (!aTime && !bTime) return String(a.hostMail || '').localeCompare(String(b.hostMail || ''));\n"
                 "      if (!aTime) return 1;\n"
                 "      if (!bTime) return -1;\n"
                 "      return aTime - bTime || String(a.hostMail || '').localeCompare(String(b.hostMail || ''));\n"
                 "    })")
          if old not in text:
              raise SystemExit('Expected renewal sort expression was not found; refusing to patch.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit hotfix and remove temporary workflow
        run: |
          rm .github/workflows/renewal-sort-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/renewal-sort-hotfix.yml
          git commit -m "fix: sort host renewals by actual date"
          git push origin master
