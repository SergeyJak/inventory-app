name: Security audit fix

on:
  push:
    branches:
      - security/npm-audit-2026-10-07

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/npm-audit-2026-10-07
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify audit
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); console.log('SUMMARY', JSON.stringify(a.metadata?.vulnerabilities || {}));"
      - name: Commit lockfile and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm -f .github/workflows/security-audit-fix.yml .github/workflows/security-audit-detail.yml
          git commit -m "security: apply npm audit fixes"
          git push
