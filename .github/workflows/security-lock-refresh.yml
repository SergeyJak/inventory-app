name: Security lock refresh

on:
  push:
    branches:
      - security/npm-audit-2026-10-07

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/npm-audit-2026-10-07
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit resolved tree
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2))"
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/security-lock-refresh.yml
          git commit -m "security: refresh package lock"
          git push
