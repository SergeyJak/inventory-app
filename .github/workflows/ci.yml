name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: |
          node --check server.js
          node --check catalog.js
          node --check product-pages.js
          node --check knowledge-base.js
          node --check knowledge-base-core.js

      - name: Core tests
        run: npm test

      - name: Knowledge Base tests
        run: node tests/knowledge-base.test.cjs

      - name: Product page tests
        run: node tests/product-pages.test.cjs

      - name: Mini 3 comparison tests
        run: node tests/mini3-comparison.test.cjs
