name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: |
          node --check server.js
          node --check catalog.js
          node --check product-pages.js
          node --check knowledge-base.js
          node --check knowledge-base-core.js
          node --check scripts/enable-yandex-plus-storefront.js
          node --check scripts/replace-yandex-plus-image.js
          node --check tests/api-integration.test.cjs
          node --check tests/e2e/static-server.cjs
          node --check tests/e2e/catalog.spec.cjs

      - name: Core tests
        run: npm test

      - name: Knowledge Base tests
        run: node tests/knowledge-base.test.cjs

      - name: Product page tests
        run: node tests/product-pages.test.cjs

      - name: Mini 3 comparison tests
        run: node tests/mini3-comparison.test.cjs

      - name: Inventory API integration tests
        run: npm run test:api

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Storefront E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
