name: Host renewal filter hotfix

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/host-renewal-filter-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Patch host renewal highlighting and filter
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')

          text = text.replace("let subAccountsStartSort = 'asc';", "let subAccountsStartSort = 'asc';\nlet hostRenewalFilter = 'all';", 1)

          renewal_re = re.compile(r"function renewalClass\(value\) \{.*?\n\}", re.S)
          renewal_new = """function hostRenewalDays(value) {
            const time = startDateTime(value);
            if (!time) return null;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return Math.round((time - today.getTime()) / 86400000);
          }

          function renewalClass(value) {
            const days = hostRenewalDays(value);
            if (days === null) return '';
            if (days < 0) return 'account-renewal-overdue';
            if (days <= 14) return 'account-renewal-soon';
            if (days <= 30) return 'account-renewal-watch';
            return '';
          }

          function hostFitsRenewalFilter(host) {
            const days = hostRenewalDays(host.renewalDate);
            if (hostRenewalFilter === 'overdue') return days !== null && days < 0;
            if (hostRenewalFilter === 'next14') return days !== null && days >= 0 && days <= 14;
            if (hostRenewalFilter === 'next30') return days !== null && days >= 0 && days <= 30;
            if (hostRenewalFilter === 'later') return days !== null && days > 30;
            if (hostRenewalFilter === 'nodate') return days === null;
            return true;
          }"""
          text, count = renewal_re.subn(renewal_new, text, count=1)
          if count != 1:
            raise SystemExit('renewalClass block not found')

          text = text.replace("  document.getElementById('accounts-table').style.display = accountsView === 'hosts' ? '' : 'none';", "  document.getElementById('accounts-table').style.display = accountsView === 'hosts' ? '' : 'none';\n  const renewalFilter = document.getElementById('host-renewal-filter');\n  if (renewalFilter) renewalFilter.style.display = accountsView === 'hosts' ? '' : 'none';", 1)

          text = text.replace("  [...hosts]\n    .sort((a, b) => {", "  [...hosts]\n    .filter(hostFitsRenewalFilter)\n    .sort((a, b) => {", 1)

          text = text.replace("document.getElementById('accounts-search')?.addEventListener('input', renderAccounts);", "document.getElementById('accounts-search')?.addEventListener('input', renderAccounts);\ndocument.getElementById('host-renewal-filter')?.addEventListener('change', e => { hostRenewalFilter = e.target.value; renderAccounts(); });", 1)
          app.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old = "    <input type=\"search\" id=\"accounts-search\" placeholder=\"Search by host, email, name, phone, status...\" />\n    <div class=\"accounts-summary\" id=\"accounts-summary\"></div>"
          new = """    <input type=\"search\" id=\"accounts-search\" placeholder=\"Search by host, email, name, phone, status...\" />
    <select id=\"host-renewal-filter\" style=\"display:none\" aria-label=\"Renewal filter\">
      <option value=\"all\">All renewals</option>
      <option value=\"overdue\">Overdue</option>
      <option value=\"next14\">Next 14 days</option>
      <option value=\"next30\">Next 30 days</option>
      <option value=\"later\">Later than 30 days</option>
      <option value=\"nodate\">No renewal date</option>
    </select>
    <div class=\"accounts-summary\" id=\"accounts-summary\"></div>"""
          if old not in html:
            raise SystemExit('accounts toolbar block not found')
          index.write_text(html.replace(old, new, 1), encoding='utf-8')

          css = Path('style.css')
          styles = css.read_text(encoding='utf-8')
          marker = ".accounts-toolbar input:focus { border-color: #0f3460; box-shadow: 0 0 0 3px rgba(15,52,96,0.1); }"
          addition = marker + "\n.accounts-toolbar select { border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 10px 12px; font-size: 0.92rem; outline: none; background: #fff; color: #1a1a2e; min-width: 170px; }\n.accounts-toolbar select:focus { border-color: #0f3460; box-shadow: 0 0 0 3px rgba(15,52,96,0.1); }"
          if marker not in styles:
            raise SystemExit('accounts toolbar css marker not found')
          css.write_text(styles.replace(marker, addition, 1), encoding='utf-8')
      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit changes and remove temporary workflow
        run: |
          rm .github/workflows/host-renewal-filter-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html style.css .github/workflows/host-renewal-filter-fix.yml
          git commit -m "fix: correct renewal highlighting and add renewal filter"
          git push origin master
